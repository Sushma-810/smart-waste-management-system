server {
    listen 80;
    listen [::]:80;

    server_name localhost;

    return 301 https://$host:5173$request_uri;
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;


    # =====================================================
    # SSL
    # =====================================================

    ssl_certificate /etc/nginx/ssl/swm.crt;
    ssl_certificate_key /etc/nginx/ssl/swm.key;

    ssl_protocols TLSv1.2 TLSv1.3;


    # =====================================================
    # BROTLI
    # =====================================================

    brotli on;

    brotli_comp_level 6;

    brotli_static on;

    brotli_min_length 20;

    brotli_types
        text/plain
        text/css
        text/html
        application/javascript
        application/json
        application/xml
        application/xhtml+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;


    # =====================================================
    # React SPA
    # =====================================================

    location / {
        try_files $uri $uri/ /index.html;
    }


    # =====================================================
    # Static Assets
    # =====================================================

    location /assets/ {
        try_files $uri =404;
    }
}